version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/items/queries.sql"
    gen:
      go:
        package: "itemsdb"
        out: "internal/items/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
