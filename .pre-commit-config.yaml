# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        # Helm templates are Go-template text, not standalone YAML — they
        # only become valid YAML after `helm template` renders them (see
        # `make helm-template`), so plain YAML parsing doesn't apply here.
        exclude: ^charts/.*/templates/
    -   id: check-json
    -   id: check-added-large-files
    -   id: check-executables-have-shebangs
    -   id: detect-aws-credentials

- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.5.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args: [
      "--strict",
      "--verbose",
      # Types follow Angular's commit message guidelines; any scope is allowed.
      # https://github.com/angular/angular/blob/main/contributing-docs/commit-message-guidelines.md
      "feat", "fix", "refactor", "test", "build", "ci", "chore", "docs", "perf", "revert", "style",
    ]

- repo: https://github.com/dnephin/pre-commit-golang
  rev: v0.5.1
  hooks:
  - id: go-fmt
  - id: go-mod-tidy

- repo: local
  hooks:
  - id: golangci-lint
    name: golangci-lint
    entry: golangci-lint run
    language: system
    types: [go]
    pass_filenames: false
