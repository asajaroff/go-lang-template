{{- if .Values.secret.create }}
# Demo/local-install convenience only — see values.yaml's comment on
# `secret.create`. Real environments should pre-create
# `{{ .Values.env.existingSecret }}` via their own secret-management tooling
# and leave this disabled (Factor IV: backing services are attached, not
# templated by the app's own chart).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.env.existingSecret }}
  labels:
    {{- include "go-lang-template.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.env.existingSecretDatabaseUrlKey }}: {{ .Values.secret.databaseUrl | quote }}
{{- end }}
