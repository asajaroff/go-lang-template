{{- if .Values.migrationJob.enabled -}}
# Factor XII (Admin processes): schema migrations run once, as a Helm hook
# Job using the exact same image/config as the Deployment (same
# securityContext included, deliberately), before the new release's pods
# start serving traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "go-lang-template.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "go-lang-template.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "go-lang-template.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "go-lang-template.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "go-lang-template.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: {{ .Values.migrationJob.command | toJson }}
          envFrom:
            {{- include "go-lang-template.envFrom" . | nindent 12 }}
          env:
            {{- include "go-lang-template.secretEnv" . | nindent 12 }}
{{- end }}
