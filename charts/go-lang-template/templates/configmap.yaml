apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-lang-template.fullname" . }}
  labels:
    {{- include "go-lang-template.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.env.appName | quote }}
  ENVIRONMENT: {{ .Values.env.environment | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  PORT: {{ .Values.env.port | quote }}
