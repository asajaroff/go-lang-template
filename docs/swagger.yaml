basePath: /
definitions:
  health.Response:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/health.Status'
        type: object
      status:
        $ref: '#/definitions/health.Status'
    type: object
  health.Status:
    enum:
    - healthy
    - unhealthy
    type: string
    x-enum-varnames:
    - StatusHealthy
    - StatusUnhealthy
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A microservice template built with Go, featuring configuration management,
    health checks, and more.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Lang Template Microservice API
  version: "1.0"
paths:
  /healthz/liveness:
    get:
      description: Check if the service is alive
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            $ref: '#/definitions/health.Response'
      summary: Liveness probe
      tags:
      - health
  /healthz/readiness:
    get:
      description: Check if the service is ready to handle requests (all dependencies
        are available)
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/health.Response'
        "503":
          description: Service is not ready
          schema:
            $ref: '#/definitions/health.Response'
      summary: Readiness probe
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
